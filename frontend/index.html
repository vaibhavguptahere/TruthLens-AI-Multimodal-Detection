<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TruthLens AI — Multimodal Deepfake & Content Verification</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & Babel via CDN for immediate zero-build local execution -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    function TruthLensApp() {
      const [caption, setCaption] = useState("");
      const [imageFile, setImageFile] = useState(null);
      const [previewUrl, setPreviewUrl] = useState(null);
      const [loading, setLoading] = useState(false);
      const [result, setResult] = useState(null);
      const [showHeatmap, setShowHeatmap] = useState(true);
      const [error, setError] = useState(null);

      const handleImageChange = (e) => {
        const file = e.target.files[0];
        if (file) {
          setImageFile(file);
          setPreviewUrl(URL.createObjectURL(file));
          setResult(null);
          setError(null);
        }
      };

      const handleVerify = async (e) => {
        e.preventDefault();
        if (!imageFile || !caption.trim()) {
          setError("Please provide both an image and an accompanying text claim.");
          return;
        }

        setLoading(true);
        setError(null);

        const formData = new FormData();
        formData.append("image", imageFile);
        formData.append("caption", caption);

        try {
          const res = await fetch("http://localhost:8000/api/verify", {
            method: "POST",
            body: formData
          });

          if (!res.ok) {
            const errData = await res.json();
            throw new Error(errData.detail || "Verification failed");
          }

          const data = await res.json();
          setResult(data);
        } catch (err) {
          setError(err.message);
        } finally {
          setLoading(false);
        }
      };

      return (
        <div class="max-w-6xl mx-auto px-4 py-8">
          {/* Header */}
          <header class="flex items-center justify-between pb-6 mb-8 border-b border-slate-800">
            <div>
              <div class="flex items-center gap-3">
                <span class="text-3xl">🔍</span>
                <h1 class="text-2xl font-bold tracking-tight bg-gradient-to-r from-blue-400 to-indigo-300 bg-clip-text text-transparent">
                  TruthLens AI
                </h1>
              </div>
              <p class="text-sm text-slate-400 mt-1">
                CSET346 Multimodal Deepfake Detection & Explainable Verification
              </p>
            </div>
            <span class="px-3 py-1 text-xs rounded-full bg-blue-950/70 border border-blue-700/50 text-blue-300 font-mono">
              Local System v1.0
            </span>
          </header>

          <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            {/* Input Form Column */}
            <div class="lg:col-span-5 bg-slate-800/60 p-6 rounded-2xl border border-slate-700/50 backdrop-blur-sm">
              <h2 class="text-lg font-semibold mb-4 text-slate-200">1. Multimodal Input Pair</h2>
              
              <form onSubmit={handleVerify} class="space-y-4">
                {/* Image Upload Area */}
                <div>
                  <label class="block text-xs font-medium text-slate-300 mb-2">Image Modality</label>
                  <div class="border-2 border-dashed border-slate-700 hover:border-blue-500 rounded-xl p-4 text-center cursor-pointer transition relative">
                    <input 
                      type="file" 
                      accept="image/*" 
                      onChange={handleImageChange} 
                      class="absolute inset-0 opacity-0 cursor-pointer w-full h-full"
                    />
                    {previewUrl ? (
                      <img src={previewUrl} class="max-h-48 mx-auto rounded-lg object-contain shadow-md" />
                    ) : (
                      <div class="py-6">
                        <span class="text-3xl block mb-2">🖼️</span>
                        <p class="text-sm font-medium text-slate-300">Click or drag image here</p>
                        <p class="text-xs text-slate-500 mt-1">JPEG, PNG, WebP ($224 \times 224$ standard)</p>
                      </div>
                    )}
                  </div>
                </div>

                {/* Caption Input */}
                <div>
                  <label class="block text-xs font-medium text-slate-300 mb-2">Text / Caption Modality</label>
                  <textarea 
                    rows="3" 
                    value={caption} 
                    onChange={(e) => setCaption(e.target.value)}
                    placeholder="Enter accompanying claim, post title, or news headline..."
                    class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-blue-500"
                  />
                </div>

                {error && (
                  <div class="p-3 bg-red-950/60 border border-red-700/50 rounded-xl text-red-300 text-xs">
                    {error}
                  </div>
                )}

                <button
                  type="submit"
                  disabled={loading}
                  class="w-full py-3 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-semibold rounded-xl text-sm transition shadow-lg disabled:opacity-50"
                >
                  {loading ? "Analyzing Multimodal Evidence..." : "Run TruthLens Verification"}
                </button>
              </form>
            </div>

            {/* Results Column */}
            <div class="lg:col-span-7 space-y-6">
              {result ? (
                <div>
                  {/* Verdict Card */}
                  <div class={`p-6 rounded-2xl border ${
                    result.prediction === "REAL" 
                      ? "bg-emerald-950/30 border-emerald-600/50" 
                      : result.prediction === "FAKE"
                      ? "bg-rose-950/30 border-rose-600/50"
                      : "bg-amber-950/30 border-amber-600/50"
                  }`}>
                    <div class="flex items-center justify-between">
                      <div>
                        <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Verification Verdict</span>
                        <h3 class={`text-3xl font-extrabold mt-1 ${
                          result.prediction === "REAL" ? "text-emerald-400" : result.prediction === "FAKE" ? "text-rose-400" : "text-amber-400"
                        }`}>
                          {result.prediction}
                        </h3>
                      </div>
                      <div class="text-right">
                        <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Confidence</span>
                        <p class="text-2xl font-bold text-slate-100">{(result.confidence * 100).toFixed(1)}%</p>
                      </div>
                    </div>

                    <p class="text-sm text-slate-300 mt-4 leading-relaxed border-t border-slate-700/50 pt-3">
                      {result.report.evidence_explanation}
                    </p>
                  </div>

                  {/* Multimodal Diagnostics Grid */}
                  <div class="grid grid-cols-2 gap-4 mt-6">
                    <div class="p-4 bg-slate-800/50 rounded-xl border border-slate-700/50">
                      <span class="text-xs text-slate-400 font-medium">Text Modality (DistilBERT)</span>
                      <p class="text-lg font-bold mt-1 text-slate-200">
                        {result.text_prediction} <span class="text-xs text-slate-400">({(result.text_confidence * 100).toFixed(1)}%)</span>
                      </p>
                    </div>
                    <div class="p-4 bg-slate-800/50 rounded-xl border border-slate-700/50">
                      <span class="text-xs text-slate-400 font-medium">Image Modality (ResNet-50)</span>
                      <p class="text-lg font-bold mt-1 text-slate-200">
                        {result.image_prediction} <span class="text-xs text-slate-400">({(result.image_confidence * 100).toFixed(1)}%)</span>
                      </p>
                    </div>
                  </div>

                  {/* Explainability Section */}
                  <div class="bg-slate-800/60 p-6 rounded-2xl border border-slate-700/50 mt-6">
                    <h3 class="text-md font-semibold text-slate-200 mb-4 flex items-center justify-between">
                      <span>Visual Evidence (Grad-CAM Heatmap)</span>
                      <label class="flex items-center text-xs font-normal text-slate-400 cursor-pointer">
                        <input 
                          type="checkbox" 
                          checked={showHeatmap} 
                          onChange={(e) => setShowHeatmap(e.target.checked)} 
                          class="mr-2 rounded bg-slate-900 text-blue-500"
                        />
                        Overlay Heatmap
                      </label>
                    </h3>

                    <div class="relative max-w-sm mx-auto rounded-xl overflow-hidden shadow-lg border border-slate-700">
                      <img src={previewUrl} class="w-full object-cover" />
                      {showHeatmap && result.gradcam_heatmap_base64 && (
                        <img 
                          src={`data:image/png;base64,${result.gradcam_heatmap_base64}`} 
                          class="absolute inset-0 w-full h-full object-cover opacity-65 mix-blend-color-dodge pointer-events-none" 
                        />
                      )}
                    </div>

                    {/* Saliency Tokens */}
                    <div class="mt-6 border-t border-slate-700/50 pt-4">
                      <h4 class="text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Salient Linguistic Cues</h4>
                      <div class="flex flex-wrap gap-2">
                        {result.token_attributions && result.token_attributions.map((t, idx) => (
                          <span 
                            key={idx} 
                            class="px-2.5 py-1 text-xs rounded-lg border font-mono bg-blue-950/40 border-blue-700/40 text-blue-200"
                          >
                            {t.token} <span class="text-slate-400">({t.importance})</span>
                          </span>
                        ))}
                      </div>
                    </div>
                  </div>
                </div>
              ) : (
                <div class="h-full flex flex-col items-center justify-center p-12 bg-slate-800/30 rounded-2xl border border-slate-800 border-dashed text-slate-500">
                  <span class="text-4xl block mb-3">🛡️</span>
                  <p class="font-medium text-slate-400">Awaiting Multimodal Input Pair</p>
                  <p class="text-xs mt-1 text-center max-w-xs">
                    Upload an image and type its accompanying caption to view REAL / FAKE / UNCERTAIN predictions with explainable visual heatmaps.
                  </p>
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.render(<TruthLensApp />, document.getElementById("root"));
  </script>
</body>
</html>
